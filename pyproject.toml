[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "3cat-downloader"
dynamic = ["version"]
description = "Descarrega temporades i sèries senceres de 3cat (escriptori, Docker i servei Linux)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oriol Serrat" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "yt-dlp>=2025.1.1",
    "imageio-ffmpeg>=0.5.1",
    "python-multipart>=0.0.9",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Web Environment",
    "Natural Language :: Catalan",
    "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/Uriracer/3cat-downloader"
Documentation = "https://github.com/Uriracer/3cat-downloader#readme"
Issues = "https://github.com/Uriracer/3cat-downloader/issues"

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]
dev = ["pywebview>=5.0", "pyinstaller>=6.6", "pytest>=8.0", "build>=1.2"]

[project.scripts]
tresdl = "tresdl.cli:main"
3cat-downloader = "tresdl.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["tresdl*"]

[tool.setuptools.package-data]
tresdl = ["web/*", "web/**/*", "arr/*.md"]

[tool.setuptools.dynamic]
version = { attr = "tresdl.__version__" }
