# Stack multimèdia complet per a un mini-PC (Proxmox) o una Raspberry Pi 5:
# Jellyfin + Sonarr + Radarr + Prowlarr (+ Jackett opcional) + qBittorrent
# + Seerr (successor de Jellyseerr/Overseerr) + 3Cat Downloader.
#
# Còpia .env.example a .env, revisa'l i executa:   docker compose up -d
#
# Estructura de carpetes (guia TRaSH, una sola carpeta /data per permetre
# enllaços durs i moviments instantanis):
#
#   ${DATA_ROOT}/
#   ├── torrents/{tv,movies}        ← qBittorrent
#   ├── downloads/3cat/             ← 3Cat Downloader
#   └── media/{tv,movies}           ← biblioteques de Sonarr/Radarr i Jellyfin
#
# Tots els contenidors veuen les carpetes al MATEIX camí (/data/...), de manera
# que Sonarr/Radarr poden importar el que descarreguen els altres sense mapatges.

x-common-env: &common-env
  PUID: ${PUID}
  PGID: ${PGID}
  TZ: ${TZ}
  UMASK: "002"

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      <<: *common-env
    volumes:
      - ${CONFIG_ROOT}/jellyfin:/config
      - ${DATA_ROOT}/media:/data/media
    ports:
      - "8096:8096"
    # Transcodificació per maquinari (Intel/AMD): descomenta i passa /dev/dri al contenidor LXC.
    # devices:
    #   - /dev/dri:/dev/dri
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      <<: *common-env
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - "8989:8989"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      <<: *common-env
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - "7878:7878"
    restart: unless-stopped

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      <<: *common-env
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped

  # Opcional: Prowlarr ja fa la feina de Jackett. Activa'l amb
  #   docker compose --profile jackett up -d
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    profiles: ["jackett"]
    environment:
      <<: *common-env
    volumes:
      - ${CONFIG_ROOT}/jackett:/config
    ports:
      - "9117:9117"
    restart: unless-stopped

  # Per a indexadors protegits per Cloudflare (s'afegeix com a "proxy" a Prowlarr).
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    ports:
      - "8191:8191"
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    environment:
      <<: *common-env
      WEBUI_PORT: "8080"
    volumes:
      - ${CONFIG_ROOT}/qbittorrent:/config
      - ${DATA_ROOT}/torrents:/data/torrents
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped

  # Seerr substitueix Jellyseerr i Overseerr (projectes fusionats el 2026).
  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    volumes:
      - ${CONFIG_ROOT}/seerr:/app/config
    ports:
      - "5055:5055"
    restart: unless-stopped

  # IMPORTANT: 3cat només serveix molts continguts a Espanya. Aquest contenidor
  # NO ha de sortir per una VPN estrangera (si fas servir gluetun per a
  # qBittorrent, deixa 3Cat Downloader fora de la seva xarxa).
  3cat-downloader:
    image: ghcr.io/${GHCR_OWNER}/3cat-downloader:latest
    container_name: 3cat-downloader
    environment:
      <<: *common-env
      TRESDL_DOWNLOAD_DIR: /data/downloads/3cat
      TRESDL_PASSWORD: ${TRESDL_PASSWORD:-}
    volumes:
      - ${CONFIG_ROOT}/3cat-downloader:/config
      - ${DATA_ROOT}/downloads/3cat:/data/downloads/3cat
    ports:
      - "8765:8765"
    restart: unless-stopped
    stop_grace_period: 30s
